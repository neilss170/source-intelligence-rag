[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-workspace-api"
version = "0.1.0"
description = "Document-grounded question answering API"
requires-python = ">=3.11"
dependencies = [
  # 0.137+ keeps included routes unprefixed, which breaks route-template metrics.
  "fastapi>=0.115,<0.137",
  "httpx>=0.28,<1.0",
  "sentence-transformers>=3.4,<6.0",
  "pymupdf>=1.25,<2.0",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "pgvector>=0.3,<1.0",
  "argon2-cffi>=23.1,<26.0",
  "redis>=5.2,<7.0",
  "email-validator>=2.2,<3.0",
  "arq>=0.26,<1.0",
  "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Generated by Alembic autogenerate; long SQL lines are clearer left whole.
"alembic/versions/*" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
