name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: si
          POSTGRES_PASSWORD: si_dev_password
          POSTGRES_DB: source_intelligence_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U si -d source_intelligence_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql+psycopg://si:si_dev_password@127.0.0.1:5433/source_intelligence_test
      REDIS_URL: redis://127.0.0.1:6380/15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e "backend[dev]"
      - name: Database extensions
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=si_dev_password psql -h 127.0.0.1 -p 5433 -U si -d source_intelligence_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS citext;"
      - run: ruff check backend/app backend/tests backend/scripts backend/evaluation backend/alembic
      - run: ruff format --check backend/app backend/tests backend/scripts backend/evaluation backend/alembic
      - name: Migrations apply, reverse and match the models
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - run: pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp backend/.env.example backend/.env
      - run: docker compose build
